name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a new stable version tag
        env:
          TAG_DELETED: ${{ github.event.deleted }}
          TAG_FORCED: ${{ github.event.forced }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$TAG_DELETED" == true || "$TAG_FORCED" == true ]]; then
            echo 'Publish requires a new immutable vX.Y.Z tag.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@finqo-app"
          cache: npm

      - name: Verify release source and package version
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
            echo 'The tag no longer points at the commit that triggered this run.'
            exit 1
          fi
          git merge-base --is-ancestor "$tag_commit" origin/main
          node <<'NODE'
          const {version} = require('./package.json');
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must match package.json version');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote_tag="$(git ls-remote --exit-code origin "$GITHUB_REF" "${GITHUB_REF}^{}")"
          remote_commit="$(printf '%s\n' "$remote_tag" | awk -v ref="$GITHUB_REF" '
            $2 == ref { direct = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print peeled ? peeled : direct }
          ')"
          if [ -z "$remote_commit" ] || [ "$remote_commit" != "$(git rev-parse HEAD)" ]; then
            echo 'The remote release tag is missing or no longer points at this commit.'
            exit 1
          fi
          npm publish --access public
