name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize finalization with manual release preparation on main.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require release automation token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'Configure RELEASE_PLEASE_TOKEN so release tags can trigger Publish.'
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
