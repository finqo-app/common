name: Prepare release
run-name: Prepare release · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize preparation with automatic release finalization on main.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require main and release automation token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Run Prepare release from main.'
            exit 1
          fi
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'Configure RELEASE_PLEASE_TOKEN for release PR automation.'
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        id: prepare
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - name: Link the release PR
        uses: actions/github-script@v7
        env:
          RELEASE_PR: ${{ steps.prepare.outputs.pr }}
        with:
          script: |
            const pr = JSON.parse(process.env.RELEASE_PR || 'null');
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            core.summary.addHeading('Release preparation', 2);
            if (pr) {
              core.summary.addLink(pr.title, `${repoUrl}/pull/${pr.number}`)
                .addRaw('\n\nReview the version, changelog and CI before merging. Merging the release PR creates its version tag and publishes the package to GitHub Packages.');
            } else {
              core.summary.addRaw('No release PR was created or changed. An existing PR may already be up to date, or there may be no releasable changes.\n\n')
                .addLink('Open pull requests', `${repoUrl}/pulls`);
            }
            await core.summary.write();
