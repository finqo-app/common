name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Formatting
        run: npm run lint

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Types
        run: npm run typecheck

  build:
    name: Package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Package build
        run: npm run build

  required:
    name: CI passed
    needs: [lint, types, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize validation
        uses: actions/github-script@v7
        env:
          VALIDATION_JOBS: ${{ toJSON(needs) }}
        with:
          script: |
            const jobs = JSON.parse(process.env.VALIDATION_JOBS);
            const labels = {"lint": "Formatting", "types": "Types", "build": "Package build"};
            const rows = Object.entries(jobs).map(([id, job]) => [labels[id] || id, job.result]);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await core.summary
              .addHeading('CI results', 2)
              .addTable([[{ data: 'Check', header: true }, { data: 'Result', header: true }], ...rows])
              .addLink('Open pipeline graph and logs', runUrl)
              .write();
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          IFS=',' read -ra results <<< "$RESULTS"
          for result in "${results[@]}"; do
            if [ "$result" != success ]; then
              echo "Required validation did not succeed: $RESULTS"
              exit 1
            fi
          done
